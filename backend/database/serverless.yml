org: ajimenez
service: dance-tutor-data

provider:
  name: aws
  region: ${opt:region, 'eu-south-2'}

resources:
  Resources:
    Cluster:
      Type: AWS::DSQL::Cluster
      Properties:
        DeletionProtectionEnabled: ${self:custom.deletionProtection.${sls:stage}, false}
  Outputs:
    ClusterEndpoint:
      Value: !GetAtt Cluster.Endpoint
    ClusterArn:
      Value: !GetAtt Cluster.ResourceArn

custom:
  deletionProtection:
    prod: true
